# Phase 2 · Task 9.2 — reviewed static-legacy compatibility catalog manifest.
#
# This manifest pins the *cumulative end-of-Phase-2 static catalog*: the three
# unchanged `final` pilot workers (from `phase2-pilot-v1`) plus the `compat.*`
# compatibility subset mirroring the EVIDENCE-FAITHFUL core of the frozen 18-agent
# `stock-deep-dive` legacy graph (user-ruled Option A — honest core only).
#
# The core is the two legacy nodes whose Task-0 fixture `target_worker` has a
# registered Phase-1 output schema and the right execution kind:
#   news-sentiment -> text.sentiment   (llm, SentimentReport)
#   report-writer  -> dec.research_mgr (llm, ReportOutput -> ResearchPlan 5-band)
# connected by report-writer's reviewed SOFT dependency on news-sentiment. The
# other 16 nodes' planned workers have unregistered output schemas (arriving with
# Phase 3 data/PIT) or deterministic execution kinds, so no honest MAPPED row can
# exist for them yet and they carry no compat mirror.
#
# The compat workers are NOT declared field-by-field here: each embeds a
# `CompatibilityBinding` whose `legacy_mapping_digest` derives from the reviewed
# `LegacyGraphMapping` (see
# `guanlan_v2.orchestration.presets.build_stock_deep_dive_compat_mapping`), so the
# worker set is built programmatically from that reviewed mapping + the on-disk
# materials under `materials/stock-deep-dive-compat-v1/`. This manifest is the
# reviewed pin: `guanlan_v2.orchestration.presets.load_compat_catalog` rebuilds the
# snapshot through the Phase-1 material-aware builder and requires the sealed
# `catalog_digest` below to match. Editing any material — or the reviewed mapping —
# without regenerating this digest fails startup. The digest is location- and
# load-order-independent (materials are addressed by ref identity).

catalog_version: "phase2-static-v1"

# Legacy source this compatibility subset mirrors (must match the frozen Task-0
# fixture source schema + normalized config digest — the FULL 18-node config).
legacy_source_schema: "financial_analyst.swarm.stock-deep-dive@1"
legacy_source_config_digest: "5a175cb91de0cff8358da93272a4ac26fb29013a833a062a096fae56be5b9dbb"

# Shared compat materials (digests recomputed from these physical bytes at load).
materials:
  prompts:
    - id: compat.prompt.mirror
      file: prompts/compat_mirror.md
  guardrails:
    - id: compat.guard.discipline
      file: guardrails/compat_discipline.md
  skills:
    - id: compat.skill.mirror
      file: skills/compat_mirror.md

# Reviewed compat.* mirror worker ids (built from the reviewed mapping in code).
compat_workers:
  - compat.news_sentiment
  - compat.report_writer

# Pinned cumulative static catalog digest (sha256+cjson-v1 over the sealed
# WorkerCatalogSnapshot: 3 final pilot workers + 2 compat.* workers + materials).
catalog_digest: "b41bf223f0dd0b05c5a4f4f7bbd32960eef90d7176a17300dbe576f6b61bf0d3"
