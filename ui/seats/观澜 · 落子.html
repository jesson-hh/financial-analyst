<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>观澜 · 落子</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" />
<link rel="stylesheet" href="../_shared/tokens.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: var(--sans); color: var(--ink); background: var(--paper); overflow-x: auto; overflow-y: hidden; }
  #root { min-width: 1280px; height: 100%; }
  .num, .mono { font-variant-numeric: tabular-nums; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(28,24,20,0.16); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
  body.dark *::-webkit-scrollbar-thumb { background: rgba(237,228,204,0.18); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.7); } }
  @keyframes pop { 0% { opacity: 0; } 60% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes lzGlow { 0%,100% { box-shadow: 0 0 0 rgba(168,57,45,0); } 50% { box-shadow: 0 0 14px rgba(168,57,45,0.32); } }
  @keyframes lzSeal { 0% { opacity: 0; transform: scale(0.8) rotate(-7deg); } 70% { transform: scale(1.07) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  .hover-row:hover { background: rgba(28,24,20,0.04) !important; }
  body.dark .hover-row:hover { background: rgba(237,228,204,0.05) !important; }
  .lz-news-panel { position:absolute; top:12px; right:12px; z-index:5; width:min(430px,calc(100% - 24px)); max-height:78%; display:flex; flex-direction:column; overflow:hidden; color:var(--ink); background:color-mix(in srgb,var(--paper) 95%,transparent); border:1px solid var(--line); border-radius:14px; box-shadow:0 18px 48px rgba(28,24,20,.18),0 2px 8px rgba(28,24,20,.08); backdrop-filter:blur(14px); animation:fadeIn .18s ease-out; }
  .lz-news-panel__head { display:flex; align-items:center; gap:11px; flex:0 0 auto; padding:13px 14px 12px; border-bottom:1px solid var(--line-soft); background:linear-gradient(120deg,rgba(168,57,45,.055),transparent 52%); }
  .lz-news-panel__mark { width:30px; height:30px; display:grid; place-items:center; flex:0 0 auto; border:1px solid var(--zhu-soft); border-radius:9px; color:var(--zhu); background:rgba(168,57,45,.06); font:600 15px var(--serif); }
  .lz-news-panel__eyebrow { color:var(--ink-3); font:500 8px/1 var(--mono); letter-spacing:.15em; }
  .lz-news-panel__title { margin-top:4px; color:var(--ink); font:700 15px/1.1 var(--serif); }
  .lz-news-panel__title span { display:inline-flex; margin-left:5px; padding:2px 6px; border-radius:99px; color:var(--yin); background:rgba(74,107,92,.08); font:500 9px/1.2 var(--mono); vertical-align:2px; }
  .lz-news-panel__close { width:28px; height:28px; margin-left:auto; display:grid; place-items:center; flex:0 0 auto; border:0; border-radius:8px; color:var(--ink-3); background:transparent; font:300 21px/1 var(--sans); cursor:pointer; transition:background .15s,color .15s; }
  .lz-news-panel__close:hover { color:var(--ink); background:rgba(28,24,20,.06); }
  .lz-news-panel__list { min-height:0; overflow:auto; padding:4px 8px 7px; }
  .lz-news-item { display:grid; grid-template-columns:50px minmax(0,1fr); gap:11px; padding:11px 8px; border-bottom:1px solid var(--line-soft); border-radius:8px; transition:background .15s; }
  .lz-news-item:last-child { border-bottom-color:transparent; }
  .lz-news-item:hover { background:rgba(28,24,20,.035); }
  .lz-news-item.is-hit { background:rgba(191,138,23,.09); box-shadow:inset 2px 0 0 rgba(191,138,23,.62); }
  .lz-news-item__time { padding-top:2px; color:var(--ink-3); font:400 9px/1.35 var(--mono); text-align:right; }
  .lz-news-item__time b { display:block; color:var(--ink-2); font-size:11px; font-weight:600; letter-spacing:.02em; }
  .lz-news-item__time span { display:block; margin-top:2px; opacity:.78; }
  .lz-news-item__body { min-width:0; }
  .lz-news-item__meta { min-height:17px; display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .lz-news-item__source { max-width:175px; overflow:hidden; padding:2px 6px; border:1px solid var(--line); border-radius:5px; color:var(--ink-3); background:rgba(255,255,255,.22); font:400 8.5px/1.2 var(--mono); text-overflow:ellipsis; white-space:nowrap; }
  .lz-news-item__hit { padding:2px 6px; border-radius:5px; color:#8e6510; background:rgba(191,138,23,.11); font:500 8px/1.2 var(--mono); }
  .lz-news-item__headline { color:var(--ink); font:500 13px/1.58 var(--sans); letter-spacing:.01em; overflow-wrap:anywhere; }
  .lz-news-panel__empty { padding:34px 16px; color:var(--ink-3); font:400 11px/1.6 var(--serif); text-align:center; }
  .lz-news-panel__foot { flex:0 0 auto; padding:7px 14px 8px; border-top:1px solid var(--line-soft); color:var(--ink-3); background:rgba(28,24,20,.018); font:400 8px/1 var(--mono); letter-spacing:.04em; }
  body.dark .lz-news-panel__close:hover, body.dark .lz-news-item:hover { background:rgba(237,228,204,.055); }
  body.dark .lz-news-item__source { background:rgba(255,255,255,.025); }
  select { appearance: none; -webkit-appearance: none; }
  input[type=range] { height: 4px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script src="../_shared/guanlan-bus.js?v=6"></script>
<script src="../_shared/guanlan-nav.js?v=6"></script>
<script>
  // 观澜 后端开关 — 默认同源（本页由 guanlan_v2/server.py 在 9999 服务，同源即真后端引擎）。
  //   http(s) 打开（经薄壳服务）→ 连真 /seats/daily，K线显示 stock_data 真日K。
  //   file:// 直接打开（无后端）→ 留 null，luozi-data 回退合成样例（诚实降级）。
  window.GUANLAN_BACKEND =
    (location.protocol === 'http:' || location.protocol === 'https:') ? location.origin : null;
</script>

</html>
